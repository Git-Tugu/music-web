      <style>
    /* Style the children inside the scroll box */
    .product-card {
      width: 200px;
      height: 300px;
      background-color: #f3f4f6;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);

<body>
    <header>
        <nav>
            <div class="right-nav-sector">
                <img src="./assets/icons/logo.svg" alt="logo" height="32px" color="var(--main-purple-100)">
            </div>

            <div class="center-nav-sector">
                <form id="nav-search-form" class="nav-search" role="search">
                    <button type="submit" class="search-btn" aria-label="Search">
                        <img src="./assets/icons/search.svg" alt="search" height="20px">
                    </button>
                    <input name="q" type="search" class="textSmall" placeholder="Lets find what you are seeking" aria-label="Search input" />
                </form>
            </div>

            <div class="left-nav-sector">
                <div id="account-section">
                    <div class="login-btn-home">
                        <a href="./login.html" class="textMedium" style="color: var(--pure-white);">Log In</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <div id="main">
            <div id="playlist">
                <div>
                    <div id="playlist-header">
                        <img id="playlist-collapse-btn" src="./assets/icons/collapse.svg" alt="collapse" height="20px">
                        <span class="textLarge">Playlists</span>
                    </div>
                    <form id="playlist-search-form" class="playlist-search" role="search">
                        <button type="submit" id="playlist-search-btn" aria-label="Search">
                            <img src="./assets/icons/search.svg" alt="search" height="20px">
                        </button>
                        <input name="q" type="search" class="textSmall" placeholder="Find your playlist" aria-label="Search input" style="color: var(--dark-purple-400)"/>
                    </form>
                    <div class="util">
                        <span class="button-icon">
                            <img src="./assets/icons/plus.svg" alt="add playlist" height="16">
                        </span>
                        <span class="row">
                            <span id="listViewName" class="textMedium">
                                Recent
                            </span>
                            <span id="playlist-view-toggle" class="button-icon" role="button" tabindex="0" aria-label="Switch to grid view" aria-pressed="false">
                                <img id="playlist-view-icon" src="./assets/icons/playlist-view.svg" alt="list-view-menu" height="16">
                            </span>
                        </span>
                    </div>
                    <div id="playlist-list" class="playlist-list list-view"></div>
                </div>
            </div>
            <div id="adjuster">
                <div class="line"></div>
            </div>

                        </div>
